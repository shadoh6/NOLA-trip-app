<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOLA trip picks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚜️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#1C2433; --muted:#5B6578; --line:#D5DBE3;
  --cobalt:#1D4E9E; --tile:#FBFCFD; --tile-ink:#1D4E9E; --grout:#C9D0D9;
  --up:#2E7D4F; --upbg:#E2F1E7; --side:#9A6210; --sidebg:#F6EAD5;
  --down:#B3362B; --downbg:#F8E0DC; --star:#9C7400; --starbg:#FAEFC6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --surface:#1B2230; --ink:#E7EBF1; --muted:#9BA5B6; --line:#2C3546;
    --cobalt:#86A9EA; --tile:#E9EEF5; --tile-ink:#1D4E9E; --grout:#3A4558;
    --up:#7CCB98; --upbg:#1E3628; --side:#E2B05C; --sidebg:#3A2D17;
    --down:#F0897D; --downbg:#3D201D; --star:#F0C94A; --starbg:#3A3214;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --surface:#1B2230; --ink:#E7EBF1; --muted:#9BA5B6; --line:#2C3546;
  --cobalt:#86A9EA; --tile:#E9EEF5; --tile-ink:#1D4E9E; --grout:#3A4558;
  --up:#7CCB98; --upbg:#1E3628; --side:#E2B05C; --sidebg:#3A2D17;
  --down:#F0897D; --downbg:#3D201D; --star:#F0C94A; --starbg:#3A3214;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo",-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* Sidewalk street-name tiles */
.tiles{display:flex;flex-wrap:wrap;gap:2px;padding:2px;background:var(--grout);border-radius:3px;width:max-content;max-width:100%}
.tiles span{display:grid;place-items:center;width:1.55em;height:1.55em;background:var(--tile);color:var(--tile-ink);
  font-weight:800;border-radius:1px;box-shadow:inset 0 0 0 2px var(--tile),inset 0 0 0 3px var(--tile-ink)}
.tiles span.gap{background:transparent;box-shadow:none;width:.6em}
.tiles.big{font-size:22px}
.tiles.sec{font-size:15px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand small{color:var(--muted);font-size:13px;line-height:1.25}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:8px 2px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--cobalt);color:var(--surface)}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:#121722}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{color:#121722}}

.status{font-size:13px;color:var(--muted);padding:8px 0 0;display:flex;gap:6px;align-items:flex-start}
.status .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.status.sync .dot{background:var(--up)}
.status.local .dot,.status.stale .dot{background:var(--side)}

main{padding:14px 0 40px}
.sechead{margin:6px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:8px 0 2px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 10px;font-size:14px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.toggle input{width:18px;height:18px;accent-color:var(--cobalt)}

.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:13px 14px 12px;margin:0 0 10px}
.item.v1{border-left-color:var(--up)}
.item.v0{border-left-color:var(--side)}
.item.vm{border-left-color:var(--down)}
.item h3{margin:0;font-size:17px;line-height:1.3;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 0}
.pill{font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);font-weight:500}
.pill.tag{background:var(--starbg);color:var(--star);font-weight:600}
.desc{margin:8px 0 10px;font-size:15px;max-width:62ch}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.votes{display:flex;gap:6px}
.vb,.sb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px;min-height:38px}
.vb .e,.sb .e{font-size:17px;line-height:1}
.side{display:inline-block;transform:rotate(-90deg)}
.vb[data-v="1"][aria-pressed="true"]{background:var(--upbg);border-color:var(--up);color:var(--up)}
.vb[data-v="0"][aria-pressed="true"]{background:var(--sidebg);border-color:var(--side);color:var(--side)}
.vb[data-v="-1"][aria-pressed="true"]{background:var(--downbg);border-color:var(--down);color:var(--down)}
.sb[aria-pressed="true"]{background:var(--starbg);border-color:var(--star);color:var(--star)}
.note{width:100%;margin-top:9px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14.5px}
.foot{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:9px;font-size:13.5px}
.others{color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.others b{color:var(--ink);font-weight:600}
.map{color:var(--cobalt);font-weight:600;text-decoration:none;white-space:nowrap}
.map:hover{text-decoration:underline}
.mk{font-weight:700}
.mk.up{color:var(--up)} .mk.side{color:var(--side)} .mk.down{color:var(--down)} .mk.star{color:var(--star)}

.gal{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 0 10px;-webkit-overflow-scrolling:touch}
.ph{flex:0 0 86%;scroll-snap-align:start;position:relative;border:0;padding:0;background:var(--bg);border-radius:8px;overflow:hidden;aspect-ratio:4/3}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cr{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addp{border:1px dashed var(--line);background:var(--bg);color:var(--cobalt);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px}
.addp.tile{flex:0 0 32%;scroll-snap-align:start}
.nophoto{margin:0 0 10px}
.swipe{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.say{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.say b{font-weight:600}
.sec h4{margin:11px 0 2px;font-size:13.5px;font-weight:700;color:var(--cobalt)}
.sec p{margin:0;font-size:15px;max-width:62ch}
.item .links{margin-top:12px}
#zoom{position:fixed;inset:0;z-index:30;background:rgba(8,10,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
#zoom[hidden]{display:none}
#zoom .zsingle{max-width:100%;max-height:72vh;object-fit:contain;border-radius:6px;display:block}
#zoom .zsp{width:min(96vw,calc(72vh * 4 / 3));aspect-ratio:4/3;overflow:hidden;border-radius:6px;position:relative}
#zoom .zsp img,.ph img.spr{position:absolute;left:0;top:0;height:100%;max-width:none;object-fit:fill;display:block}
#zBox{cursor:zoom-out}
#zoom .zc{color:#E7EBF1;font-size:13.5px;margin-top:10px;text-align:center;max-width:60ch}
#zoom .zc a{color:#9CC2FF}
#zoom .zn{display:flex;gap:10px;margin-top:12px}
#zoom .zn button{border:1px solid #4a5468;background:#1B2230;color:#E7EBF1;border-radius:10px;padding:9px 16px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:40}
#toast[hidden]{display:none}
.links{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.links a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--cobalt);font-weight:600;font-size:12.5px;text-align:center;line-height:1.2}
.links a .i{font-size:18px;line-height:1}
.links a.cur{border:2px solid var(--cobalt);background:var(--bg)}
.links a:hover{background:var(--bg)}
.pill.when{background:var(--upbg);color:var(--up);font-weight:600}
.pill.kit{background:var(--upbg);color:var(--up);font-weight:600}
.pill.ok{background:var(--upbg);color:var(--up);font-weight:600;margin-left:6px}
.r2{font-size:13.5px;background:var(--starbg);color:var(--ink);border-radius:8px;padding:8px 10px;margin:8px 0 0}
.poll{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.poll h3{margin:0 0 8px;font-size:16px;font-weight:800}
.pollopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.pollopt span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.pollopt[aria-pressed="true"]{border:2px solid var(--cobalt);background:var(--upbg)}
.grp{font-size:18px;font-weight:800;margin:22px 0 2px}
ul.lodge{margin:4px 0 0;padding-left:18px;font-size:14.5px}
ul.lodge li{margin:3px 0}
ul.lodge a{color:var(--cobalt);font-weight:600}
.price{color:var(--muted);font-size:13.5px}
.links.two{grid-template-columns:repeat(2,1fr)}
.stay .night{font-size:13.5px;font-weight:700;color:var(--cobalt);margin-bottom:4px}
.stay .facts{font-size:14.5px;margin:6px 0 10px}
.stay .facts a{color:var(--cobalt)}
dl.amen{margin:4px 0 0}
dl.amen dt{font-weight:700;font-size:14.5px;margin-top:8px}
dl.amen dd{margin:2px 0 0;font-size:14.5px}
.minih{font-weight:700;font-size:13.5px;margin:10px 0 2px}
.stay.tbd h3{margin:4px 0 10px}
#whoBtn,#status{display:none!important}
.tabs button{font-size:13px;line-height:1.2;padding:8px 4px}
.dayline{font-weight:700;color:var(--cobalt);margin:10px 0 0;font-size:15px}
.daytitle{font-size:21px;font-weight:800;margin:2px 0 4px}
.time{font-weight:800;color:var(--cobalt);font-size:14px;margin-bottom:4px}
.time.big{font-size:15px;margin:18px 0 6px}
.step h3{margin-bottom:4px}
.fit{background:var(--starbg);border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0 0}
.blurb{font-size:15px;margin:6px 0 12px;background:var(--upbg);border-radius:8px;padding:10px 12px}
.rlinks{display:flex;gap:14px;flex-wrap:wrap}
.rlinks a{color:var(--cobalt);font-weight:700;text-decoration:none;font-size:14.5px}
.empty{padding:28px 6px;text-align:center;color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin-top:18px}

.res h2{font-size:18px;margin:22px 0 8px;font-weight:800}
.res .line{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:14.5px}
.res .line .who{color:var(--muted);font-size:13.5px;margin-top:2px}
.prog{display:flex;flex-direction:column;gap:6px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--cobalt)}
.primary{border:0;background:var(--cobalt);color:var(--surface);border-radius:10px;padding:12px 16px;font-weight:800;font-size:15px;width:100%}
:root[data-theme="dark"] .primary{color:#121722}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{color:#121722}}
.export{width:100%;min-height:220px;margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;font-size:13px;line-height:1.4}
.copied{color:var(--up);font-weight:600;font-size:14px;margin-top:6px;min-height:1.2em}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(12,16,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 4px;font-size:20px;font-weight:800}
.panel p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.whos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.whos button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:14px 6px;font-weight:800;font-size:16px}
.other{display:none;gap:8px;margin-top:10px}
.other input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.other button{border:0;background:var(--cobalt);color:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700}
@media (prefers-reduced-motion: no-preference){ .panel{animation:up .22s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row1">
      <div class="brand">
        <div class="tiles big" aria-label="NOLA"><span>N</span><span>O</span><span>L</span><span>A</span></div>
        <small id="tagline"></small>
      </div>
      <button class="chip" id="langBtn"></button>
      <button class="chip" id="whoBtn"></button>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText"></span></div>
  </div>
</header>
<main class="wrap" id="main"></main>

<input type="file" accept="image/*" id="fileIn" hidden>
<div id="zoom" hidden role="dialog" aria-modal="true"><div id="zBox"></div><div class="zc" id="zCap"></div><div class="zn"><button id="zPrev">‹</button><button id="zClose"></button><button id="zNext">›</button></div></div>
<div id="toast" hidden aria-live="polite"></div>
<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <p id="sheetSub"></p>
    <div class="whos" id="whos"></div>
    <div class="other">
      <input id="otherName" maxlength="24">
      <button id="otherGo"></button>
    </div>
  </div>
</div>

<script>
// [id, section, category, price 0-3, time, name_en, name_zh, desc_en, desc_zh, map query, tag]
const ITEMS = [
["r1","r","food",1,"30 min","Billy’s Boudin & Cracklin (Scott)","比利猪肉米肠店（斯科特镇）","Cajun pork-and-rice sausage, fried boudin balls and crunchy cracklins. The classic first stop off I-10.","卡津风味猪肉米肠、炸米肠球和脆猪皮，是 I-10 路上的经典第一站。","Billy's Boudin and Cracklin Scott LA"],
["r2","r","food",1,"45 min","Cajun smokehouse lunch (Johnson’s Boucanière, Lafayette)","卡津烟熏肉午餐（拉斐特）","Smoked sausage, boudin and brisket sandwiches from a family smokehouse downtown.","拉斐特市中心家族烟熏铺的烟熏香肠、米肠和牛胸肉三明治。","Johnson's Boucaniere Lafayette LA"],
["r3","r","nature",0,"1 hr","Lake Martin & Cypress Island Preserve (Breaux Bridge)","马丁湖与柏树岛保护区（布罗布里奇）","Cypress swamp with herons, egrets and waterfowl, seen from a short boardwalk and the lakeside. The big nesting rookery runs January to June and some levee trails are closed, so November is a quieter visit.","柏树沼泽，可在短木栈道和湖边观赏苍鹭、白鹭和水鸟。大规模筑巢季在1月至6月，部分堤岸步道目前关闭，11月去会比较安静。","Cypress Island Preserve Visitor Center St. Martinville LA"],
["r4","r","nature",2,"2 hr","Atchafalaya Basin swamp boat tour (Henderson)","阿查法拉亚盆地沼泽游船（亨德森）","Boat tour through America’s largest river swamp, launching right off I-10.","乘船游览美国最大的河流沼泽，出发点紧邻 I-10。","McGee's Landing Henderson LA"],
["r5","r","museum",0,"30 min","Atchafalaya Welcome Center","阿查法拉亚游客中心","Free exhibits on the basin’s wildlife and Cajun culture, and a good break on the 18-mile swamp bridge.","免费展览介绍沼泽野生动物和卡津文化，也是跨越18英里沼泽大桥途中的好休息点。","Atchafalaya Welcome Center Butte La Rose LA"],
["r6","r","museum",1,"2 hr","Vermilionville living history village (Lafayette)","维米利恩维尔历史村（拉斐特）","Costumed artisans, old Cajun and Creole homes along a bayou, and live music some days.","穿传统服饰的工匠、河湾边的卡津和克里奥尔老房子，部分日子有现场音乐。","Vermilionville Lafayette LA"],
["r7","r","sight",2,"2–3 hr","Avery Island: Tabasco tour & Jungle Gardens","艾弗里岛：塔巴斯科辣酱工厂与丛林花园","See how Tabasco is made and taste odd flavors, then drive through gardens with egrets and gators. About 30 min south of I-10.","参观塔巴斯科辣酱的制作并试吃各种口味，再开车游览有白鹭和鳄鱼的花园。距 I-10 约30分钟。","Tabasco Factory Avery Island LA"],
["r8","r","sight",0,"1 hr","Louisiana State Capitol (Baton Rouge)","路易斯安那州议会大厦（巴吞鲁日）","The tallest state capitol in the US, with a free observation deck on the 27th floor.","全美最高的州议会大厦，27楼有免费观景台。","Louisiana State Capitol Baton Rouge"],
["r9","r","sight",0,"1 hr","LSU campus & Mike the Tiger (Baton Rouge)","路易斯安那州立大学与老虎迈克","Big SEC campus with a live tiger habitat beside Tiger Stadium. An easy stretch-your-legs stop.","大型名校校园，老虎体育场旁有真老虎栖息地，适合下车走走。","Mike the Tiger Habitat Baton Rouge"],
["r10","r","museum",1,"1 hr","USS Kidd Veterans Museum (Baton Rouge), ship away","基德号退伍军人博物馆（巴吞鲁日），军舰暂时不在","The shoreside museum only; the destroyer itself is away until at least spring 2027.","仅开放岸上博物馆；驱逐舰本身最早2027年春季才回来。","USS Kidd Veterans Museum Baton Rouge","kidd"],

["n1","n","food",1,"30 min","Café du Monde beignets","世界咖啡馆法式甜甜圈","Powdered-sugar beignets and chicory café au lait. Go early or late to skip the line.","撒满糖粉的法式甜甜圈配菊苣牛奶咖啡。早去或晚去可以避开排队。","Cafe du Monde French Market New Orleans"],
["n2","n","sight",0,"1 hr","Jackson Square & St. Louis Cathedral","杰克逊广场与圣路易斯大教堂","The heart of the French Quarter, with street artists, musicians and the city’s iconic cathedral.","法国区的中心，街头画家和音乐人云集，还有城市地标大教堂。","Jackson Square New Orleans"],

const INFO = {
r1:["A no-frills Cajun meat market in Scott, a town nicknamed the Boudin Capital of the World. Boudin is a soft sausage stuffed with pork, rice, green onion and spices; cracklins are chunks of pork skin and fat fried until crunchy.",

r3:["A roughly 9,500-acre preserve managed by The Nature Conservancy, surrounding a lake full of bald cypress trees draped in Spanish moss. It’s one of the best places in Louisiana to see wading birds and alligators in the wild.",

"可选普通有棚船（较安静，适合拍照）或更快更吵的风扇船。野生动物随季节变化；11月天气凉爽舒适，但鳄鱼较少活动。周末最好提前预订，船上有风，带件薄外套。","uh-CHAF-uh-LIE-uh"],
r5:["A state visitor center on the long I-10 bridge across the Atchafalaya Basin, with exhibits on the swamp’s wildlife, Cajun history and how people have fished and lived here.",
"It’s a free, easy leg-stretch with restrooms, and the exhibits give useful context before (or instead of) a swamp tour. The 18-mile bridge itself is one of the longest in the country, built on pillars over open swamp.",
"Allow 20 to 30 minutes. Staff can suggest swamp tours and Cajun restaurants nearby. A good backup if the family wants to see the swamp but doesn’t have time for a boat ride.",
"位于横跨阿查法拉亚盆地的 I-10 长桥上的州立游客中心，展览介绍沼泽的野生动物、卡津历史，以及当地人如何在这里捕鱼和生活。",
"免费又方便的休息站，有洗手间，展览能帮助你在坐船游沼泽之前（或代替坐船）了解背景。这座18英里长的大桥本身就是全美最长的桥梁之一，桥墩直接立在沼泽上。",
"停留20到30分钟即可。工作人员可以推荐附近的沼泽游和卡津餐厅。如果想看沼泽但没时间坐船，这里是不错的替代选择。",""],
r6:["A 23-acre open-air living history museum on Bayou Vermilion in Lafayette, showing Acadian (Cajun), Creole and Native American life from 1765 to 1890 through restored and replica homes, a chapel, a schoolhouse and workshops.",
"Costumed guides cook, weave, work a forge and chat in character, some in Cajun French. It’s the clearest way to understand who the Cajuns are: French-speaking people exiled from Canada in the 1750s who rebuilt their lives in Louisiana’s swamps.",
"Open Tuesday to Sunday, 10 a.m. to 4 p.m., with last admission at 3, so a Saturday stop works. Allow 1 to 1.5 hours; paths are gravel and grass. Some weekends feature live Cajun or zydeco music.",
"位于拉斐特维米利恩河畔、占地23英亩的露天活态历史博物馆，通过修复和复建的老房子、小教堂、学校和作坊，展示1765年至1890年间阿卡迪亚人（卡津人）、克里奥尔人和美洲原住民的生活。",
"穿着传统服饰的讲解员会现场做饭、织布、打铁，并以角色身份和你聊天，有些人还说卡津法语。这是了解卡津人最直观的方式：他们是1750年代被逐出加拿大的法语族群，后来在路易斯安那的沼泽地重建家园。",
"周二至周日上午10点至下午4点开放，3点停止入场，所以周六顺路去没问题。游览约需1到1.5小时，路面多为碎石和草地。部分周末有卡津或柴迪科（zydeco）现场音乐。","ver-MIL-yun-ville"],
r7:["The home of Tabasco hot sauce, made here by the McIlhenny family for over five generations. The “island” is actually a giant salt dome rising out of the marsh, about 30 minutes south of I-10.",
"The self-guided Tabasco experience covers a museum, a pepper greenhouse, the barrel warehouse where pepper mash ages, and a country store with tastings of unusual flavors. Then drive or walk through Jungle Gardens: 170 acres of ancient oaks, bayous, a centuries-old Buddha statue and an egret colony called Bird City.",
"Allow 2 to 3 hours for both. Look for combo tickets for the tour and gardens. The on-site restaurant, 1868!, puts Tabasco in everything. It’s a detour, so pair it with a Lafayette-area lunch.",
"塔巴斯科辣酱的故乡，麦基尔亨尼家族在这里制作辣酱已有五代以上。所谓的“岛”其实是从沼泽中隆起的巨大盐丘，距 I-10 往南约30分钟。",
"自助参观包括博物馆、辣椒温室、陈酿辣椒泥的木桶仓库，还有可以试吃各种奇特口味的商店。之后可以开车或步行游览丛林花园：170英亩的古老橡树、河湾、一尊有数百年历史的佛像，以及被称为“鸟城”的白鹭栖息地。",
"两处一起约需2到3小时。可以留意工厂和花园的套票。园内餐厅“1868!”的每道菜都加了塔巴斯科。这里需要绕路，可以和拉斐特一带的午餐一起安排。",""],
r8:["At 450 feet and 34 floors, the tallest state capitol in the United States: an Art Deco tower built in 1932 under Governor Huey Long.",
"The free observation deck on the 27th floor has sweeping views of the Mississippi River and Baton Rouge. The ornate Memorial Hall and chambers are worth a look, and there’s dramatic history: Huey Long was assassinated in a hallway here in 1935, and visitors still look for the bullet marks in the marble.",
"Free, about an hour, with a security check at the entrance. Confirm weekend hours before going. It’s about an hour west of New Orleans, so it fits on the drive in or out.",
"高450英尺、共34层，是全美最高的州议会大厦，这座装饰艺术风格的大楼于1932年在州长休伊·朗任内建成。",
"27楼的免费观景台可以俯瞰密西西比河和巴吞鲁日全景。楼内华丽的纪念大厅和议事厅也值得一看。这里还有戏剧性的历史：休伊·朗1935年在这里的走廊遇刺，游客至今仍会寻找大理石上的弹痕。",
"免费，约1小时，入口需过安检。周末开放时间出发前请确认。距新奥尔良约1小时车程，来回路上都可以顺路安排。",""],
r9:["Louisiana State University’s main campus, home of Tiger Stadium (one of the largest college football stadiums in the country) and the school’s mascot, a real tiger named Mike, who lives in a large habitat beside the stadium.",
"It’s a free, easy stop with a big-college feel: oak-shaded lawns, Italian Renaissance-style buildings and the chance to see a live tiger. For an 18-year-old, it’s also a fun look at a major Southern university.",
"Mike often naps but is more active in cool morning hours, so November is a good time. Parking near the stadium is easy on non-game days; check that there’s no home football game that weekend. Allow about an hour.",
"路易斯安那州立大学主校区，拥有全美最大的大学橄榄球场之一“老虎体育场”。体育场旁的大型园区里住着学校的吉祥物——一只名叫迈克的真老虎。",
"免费又方便的停靠点，充满名校氛围：橡树成荫的草坪、意大利文艺复兴风格的建筑，还能看到真老虎。对18岁的孩子来说，也是参观一所南方大学的好机会。",
"迈克经常在睡觉，凉爽的早上比较活跃，所以11月是好时机。非比赛日在体育场附近停车很方便，请确认当周末没有主场橄榄球比赛。约需1小时。",""],
r10:["A veterans museum on the Baton Rouge riverfront, normally home to the USS Kidd, a WWII destroyer. The ship was taken to a shipyard for a full restoration in 2024, and low water on the Mississippi has kept it from coming back; the earliest it can return is spring 2027. The photos show the ship before it left.",
"Only the small shoreside museum is open: ship models, artifacts, and an exhibit on the 1945 kamikaze attack on the Kidd, including the story of the Japanese pilot. It’s a modest stop, not the climb-through-a-warship experience the Kidd is famous for.",
"Open daily 9:30 a.m. to 3:30 p.m.; tickets about $8. Allow about an hour. Only worth it if you’re already stopping in Baton Rouge, for example to see the State Capitol nearby.",
"巴吞鲁日河边的退伍军人博物馆，平时停靠着二战驱逐舰“基德号”。这艘军舰2024年被拖去船厂全面修复，由于密西西比河水位太低一直无法返回，最早要到2027年春季。照片是军舰离开前拍的。",
"目前只开放岸上的小型博物馆：有舰船模型、文物，以及关于1945年基德号遭神风特攻队撞击的展览，包括那位日本飞行员的故事。这只是一个小站，不是基德号最出名的登舰参观体验。",
"每天上午9:30至下午3:30开放，门票约8美元。约需1小时。只有在顺路去巴吞鲁日（比如参观附近的州议会大厦）时才值得一去。",""],
n1:["An open-air coffee stand at the edge of the French Quarter that has served beignets since 1862. Beignets are square, fluffy pieces of fried dough buried under powdered sugar.",
"It’s the most iconic snack in New Orleans. The menu is tiny: beignets come three to an order, with café au lait made with chicory, a roasted root that gives the coffee a mellow, slightly bitter taste. Non-coffee drinkers can get hot chocolate or juice.",
"Lines are longest midday and on weekends, so go early morning or late evening, or use the to-go window. Wear dark clothes, and don’t inhale while biting or you’ll cough up sugar. Seating is first come, first served.",
"法国区边上的一家露天咖啡摊，从1862年开始售卖法式甜甜圈（Beignet）。这是一种方形、蓬松的油炸面团，上面堆满糖粉。",
"这是新奥尔良最具代表性的小吃。菜单非常简单：甜甜圈每份三个，配上加了菊苣的牛奶咖啡（菊苣是一种烘焙过的植物根，让咖啡口感更醇、略带苦味）。不喝咖啡的人可以点热巧克力或果汁。",
"中午和周末排队最长，建议早上或晚上去，或者用外带窗口。穿深色衣服，咬的时候别吸气，不然会被糖粉呛到。座位先到先得。","ben-YAY"],
n2:["The historic main square of the French Quarter, laid out in the 1700s, with a statue of Andrew Jackson in the center, St. Louis Cathedral (the oldest continuously active cathedral in the U.S.) behind it, and the 1840s Pontalba Buildings on two sides.",
"This is the postcard view of New Orleans. Artists hang paintings on the iron fence, brass bands and street performers play, and fortune tellers set up tables. You can step inside the cathedral for free, and the two museums beside it (the Cabildo and the Presbytère) cover Louisiana history and Mardi Gras.",
"Free and lively all day; mornings are calmer for photos. Café du Monde is across the street, and mule-drawn carriage tours start along Decatur Street.",
"法国区历史悠久的中心广场，建于1700年代，中央是安德鲁·杰克逊雕像，后方是圣路易斯大教堂（美国持续使用至今最古老的大教堂），两侧是1840年代建造的蓬塔尔巴大楼。",
"这就是新奥尔良明信片上的经典景色。画家把画挂在铁栏杆上展示，铜管乐队和街头艺人表演，算命师在路边摆桌。大教堂可以免费入内参观，旁边的两座博物馆（卡比尔多和长老会馆）介绍路易斯安那历史和狂欢节。",
"免费，全天都很热闹；早上人少，适合拍照。世界咖啡馆就在对街，迪凯特街上可以乘坐骡车观光。",""],
n3:["A string of open-air market sheds along the Mississippi River that has hosted a market since 1791, making it one of the oldest public markets in the country.",
"Browse stalls of local crafts, souvenirs, hot sauces and art, and grab snacks like pralines (a creamy pecan candy), po-boys or fresh juice. It’s an easy, relaxed stroll between Jackson Square and Frenchmen Street.",
"Free to walk. Vendors are busiest in the morning and early afternoon. Some stalls sell cheap imported souvenirs, so look for local makers. Restrooms are available in the market.",
"沿密西西比河的一排露天市场棚，自1791年起就有集市，是美国最古老的公共市场之一。",
"可以逛本地手工艺品、纪念品、辣酱和艺术品摊位，买些果仁糖（一种奶香山核桃糖）、穷小子三明治或果汁当零食。从杰克逊广场到法国人街，一路悠闲逛过去很轻松。",
"免费逛。早上和下午早些时候摊位最多。有些摊卖便宜的进口纪念品，想买本地货要留意。市场内有洗手间。","PRAH-leen (pralines)"],
n4:["A giant round Sicilian sandwich invented in 1906 at Central Grocery in the French Quarter: a sesame loaf piled with salami, ham, mortadella, provolone and a chopped, vinegary olive salad.",
"It’s one of New Orleans’ signature foods and a perfect shared lunch. A whole muffuletta is about 10 inches across, and a half easily feeds two. The olive salad soaks into the bread, which is the whole point.",
"Check whether Central Grocery is open when you visit; other French Quarter spots make it too, and some serve it warm. Most places sell it to go, so take it to the riverfront benches nearby.",
"一种巨大的圆形西西里三明治，1906年由法国区的中央杂货店发明：芝麻圆面包里夹着萨拉米香肠、火腿、意式肉肠、波萝伏洛奶酪，以及切碎的醋腌橄榄沙拉。",
"这是新奥尔良的招牌美食之一，非常适合几个人分享当午餐。一整个直径约10英寸，半个就够两个人吃。橄榄沙拉的汁浸进面包里，正是它好吃的关键。",
"去之前确认中央杂货店是否营业；法国区其他店也有卖，有的会加热。大多是外带，可以拿到附近河边的长椅上吃。","muff-uh-LET-uh"],
n5:["A huge museum complex, designated by Congress as America’s National WWII Museum, telling the story of the war from Pearl Harbor to victory through personal stories, artifacts, full-size aircraft and immersive galleries.",
"It’s consistently ranked one of the best museums in the country. You receive a “dog tag” card to follow one real person through the war, there’s a submarine experience recreating the USS Tang’s final patrol, and the 4D film “Beyond All Boundaries,” narrated by Tom Hanks, shakes the seats and fills the theater with snow and smoke.",
"General admission is about $27 to $42 per person, and theater add-ons are about $9 each. Plan at least 4 to 5 hours. Exhibits are kept cold, so bring a sweater. Buy timed tickets online; fall is a busy season.",
"一座庞大的博物馆建筑群，被美国国会定为国家二战博物馆，通过个人故事、文物、实体飞机和沉浸式展厅，讲述从珍珠港到胜利的整场战争。",
"一直被评为全美最好的博物馆之一。入馆会拿到一张“军牌”卡，跟随一位真实人物经历整场战争；有重现“刺尾鱼号”潜艇最后一次巡航的潜艇体验；汤姆·汉克斯旁白的4D电影《超越一切界限》会让座椅震动、影院里飘雪冒烟。",
"普通门票每人约27到42美元，剧场附加项目每项约9美元。至少预留4到5小时。展厅温度很低，带件毛衣。建议网上买分时段票，秋季游客较多。",""],
n6:["A tiny, weathered French Quarter room dedicated to traditional New Orleans jazz since 1961. Every evening, veteran local musicians play short, unamplified sets for small audiences.",
"It’s the most authentic, up-close way to hear the music New Orleans invented. There’s no bar, no food and no frills: just a few benches, standing room and a band a few feet away. It’s all ages, so your son can come.",
"Sets run about 45 minutes, several times each evening. Shows sell out, so book ahead online; standing tickets are cheaper than seats. Arrive a little early.",
"法国区一间小小的老屋，自1961年起专门演奏传统新奥尔良爵士乐。每晚由资深本地音乐家进行简短、不用扩音的演出，观众不多。",
"这是最原汁原味、近距离聆听新奥尔良发明的这种音乐的方式。没有酒吧、没有餐食、没有花哨装饰：只有几排长椅、站位，乐队就在几步之外。不限年龄，儿子也可以去。",
"每场约45分钟，每晚有好几场。门票常售罄，请提前网上订；站票比座位便宜。稍微提早到。",""],
n7:["A three-block strip in the Marigny neighborhood, just past the French Quarter, lined with small live-music clubs where local bands play jazz, brass, blues, funk and swing nearly every night.",
"This is where locals go for music instead of Bourbon Street. You can wander door to door and hear a different band every half block, and the Frenchmen Art Market sells handmade art in the evenings.",
"Many clubs are 21+ after dark, which matters for your 18-year-old: look for all-ages spots, go earlier in the evening, or enjoy the brass bands playing on street corners. Some clubs have no cover but expect you to buy a drink, and it’s customary to tip the band.",
"紧挨法国区的马里尼街区里一段三个街区长的街道，两旁都是小型现场音乐酒吧，本地乐队几乎每晚演奏爵士、铜管乐、蓝调、放克和摇摆乐。",
"这里是本地人听音乐的地方，而不是波本街。可以一家家逛过去，每走半个街区就能听到不同乐队。晚上还有法国人街艺术市集，卖手工艺术品。",
"很多酒吧天黑后只允许21岁以上入场，这对18岁的儿子有影响：可以找不限年龄的场所、傍晚早点去，或者在街角欣赏铜管乐队演奏。有些酒吧不收门票，但希望你点一杯饮料，习惯上也要给乐队小费。",""],
n8:["The French Quarter’s famous party street: about 13 blocks of bars, neon signs, balconies and music that become pedestrian-only at night.",
"Most visitors walk it once just to see the spectacle: crowds, street performers, balconies and live bands spilling out of open doors. For better or worse, it’s part of the city’s identity.",
"It gets loud, crowded and messy late at night, so early evening is best for a family walk-through. The drinking age is 21. Keep phones and wallets secure and stick to busy blocks.",
"法国区著名的狂欢街：约13个街区的酒吧、霓虹招牌、阳台和音乐，晚上变成步行街。",
"大多数游客只是走一趟看看热闹：人潮、街头艺人、阳台，还有从敞开的门里传出的现场乐队声。无论好坏，它都是这座城市的标志之一。",
"深夜会很吵、很挤、很乱，傍晚时一家人走一趟最合适。饮酒年龄是21岁。保管好手机和钱包，走人多的街段。",""],
n9:["The St. Charles line is the oldest continuously operating streetcar line in the world, running olive-green wooden cars from the 1920s along a grassy median under giant live oaks.",
"It’s a cheap, slow, beautiful ride past mansions, Tulane and Loyola universities and Audubon Park, and the easiest way to reach the Garden District and the zoo without driving. The windows open, and the wooden seat backs flip to face forward at the end of the line.",
"Fare is $1.25 per person each way (exact change), or buy an unlimited day pass in the transit agency’s Le Pass app. Cars can get crowded. A full one-way ride takes about 45 minutes or more.",
"圣查尔斯线是世界上持续运营至今最古老的有轨电车线路，1920年代的橄榄绿色木质车厢在巨大橡树下的草地中央隔离带上行驶。",
"便宜、慢悠悠又非常美的一段车程，沿途经过豪宅、杜兰和洛约拉大学以及奥杜邦公园，也是不开车去花园区和动物园最方便的方式。车窗可以打开，木座椅靠背在终点站可以翻转朝前。",
"单程每人1.25美元（需零钱），或在公交局的 Le Pass 应用里买一日通票。车厢可能很挤。全程单程约45分钟或更久。",""],
n10:["A residential neighborhood of grand 1800s mansions built by wealthy Americans who arrived after the Louisiana Purchase, with lush gardens, iron fences and oak-lined streets.",
"Walking these quiet streets feels like stepping into a movie set, and several houses belonged to famous residents, including author Anne Rice. It pairs naturally with the streetcar, Commander’s Palace and Magazine Street.",
"Free to explore on your own with a map, or take a guided walking tour (about 2 hours) for the stories behind each house. The homes are private, so view from the sidewalk. Lafayette Cemetery No. 1 here has been closed for restoration, so check before planning around it.",
"一个住宅街区，满是19世纪的豪宅，由路易斯安那购地案后迁来的富裕美国人建造，配有茂盛的花园、铁艺栅栏和橡树林荫道。",
"走在安静的街道上就像进入电影场景，好几栋房子曾属于名人，包括作家安妮·赖斯。可以和有轨电车、指挥官宫殿餐厅以及杂志街一起安排。",
"可以拿地图自己免费逛，也可以参加约2小时的导览，听每栋房子背后的故事。房子都是私宅，请在人行道上观赏。这里的拉法叶一号墓地一直在闭馆修复，安排前请先确认。",""],
n11:["A roughly six-mile street running from downtown to Uptown, lined with locally owned boutiques, antique and vintage shops, galleries, cafés and casual restaurants.",
"It’s where New Orleanians actually shop and eat, so it feels local rather than touristy. Good for a relaxed afternoon of browsing, coffee and snacks after the Garden District.",
"It’s long, so pick a stretch: the blocks near the Garden District and around Napoleon Avenue are the liveliest. Street parking is free in many spots but can be tight. Many small shops close by 5 or 6 p.m.",
"一条从市中心延伸到上城区、约六英里长的街道，两旁是本地人开的精品店、古董和古着店、画廊、咖啡馆和休闲餐厅。",
"这是新奥尔良本地人真正购物和吃饭的地方，感觉很生活化，不那么游客化。逛完花园区后，适合在这里悠闲地逛逛、喝咖啡、吃点东西。",
"街道很长，挑一段逛就好：花园区附近和拿破仑大道一带最热闹。很多地方路边停车免费，但车位紧张。很多小店下午5、6点就关门。",""],
n12:["A large, well-loved zoo in Uptown’s Audubon Park, known for its Louisiana Swamp exhibit (with alligators and a recreated Cajun village), its jaguar habitat and animals from around the world.",
"If the family wants a guaranteed alligator sighting, this is the surest place, and the swamp exhibit explains Louisiana wildlife well. The grounds are shady and pretty, and the streetcar ride there is part of the fun.",
"Allow about 3 hours. Look for combo tickets with the Aquarium & Insectarium. It’s about a 20-minute walk through Audubon Park from the St. Charles streetcar, or you can drive and park. Check Thanksgiving-week hours.",
"位于上城奥杜邦公园内的大型动物园，深受喜爱，以路易斯安那沼泽展区（有鳄鱼和复原的卡津村落）、美洲豹园区和来自世界各地的动物闻名。",
"如果全家想百分百看到鳄鱼，这里最稳妥，沼泽展区也很好地介绍了路易斯安那的野生动物。园区绿树成荫、景色优美，坐有轨电车过去也很有趣。",
"约需3小时。可以留意与水族馆和昆虫馆的联票。从圣查尔斯有轨电车站穿过奥杜邦公园步行约20分钟，也可以开车停车。请确认感恩节那周的营业时间。",""],
n13:["Two attractions under one roof on the riverfront near Canal Street, reopened in 2023 after a major renovation: an aquarium of the Gulf of Mexico, Mississippi River and Amazon, plus an insect museum.",
"Highlights include a huge Gulf of Mexico tank with sharks and rays, penguins, sea otters and jellyfish, followed by a walk-through butterfly garden and live bug exhibits. It’s a great indoor option if it rains.",
"Allow 2 to 3 hours. It’s an easy walk from the French Quarter. Buy tickets online and check combo deals with the zoo.",
"位于运河街附近河边的两合一景点，2023年大规模翻新后重新开放：一座以墨西哥湾、密西西比河和亚马孙为主题的水族馆，加上一座昆虫博物馆。",
"亮点包括有鲨鱼和魟鱼的巨大墨西哥湾水缸、企鹅、海獭和水母，还有可以走进去的蝴蝶花园和活体昆虫展。下雨天是很好的室内选择。",
"约需2到3小时。从法国区步行即可到达。建议网上购票，并留意与动物园的联票优惠。",""],
n14:["The giant working warehouse of Kern Studios, whose family has built New Orleans Mardi Gras parade floats since 1932.",
"On a guided tour you walk among towering, brightly painted float sculptures and watch artists carve, sculpt and paint next year’s parades. It’s the best way to understand Mardi Gras if you aren’t here in February, and tours often include a slice of king cake.",
"About 1 to 1.5 hours. Closed on Thanksgiving Day. It’s on the riverfront; there’s a free shuttle from the French Quarter area and parking on site.",
"肯恩工作室的巨型工坊，这个家族从1932年起就为新奥尔良狂欢节游行制作花车。",
"跟随导游走在高大、色彩鲜艳的花车雕塑之间，看艺术家们雕刻、塑形、彩绘明年的游行花车。如果不是二月来，这是了解狂欢节最好的方式，导览常常还会请你吃一块国王蛋糕。",
"约1到1.5小时。感恩节当天闭馆。位于河边，法国区一带有免费接驳车，现场也可以停车。",""],
n15:["A 1,300-acre park in Mid-City, larger than New York’s Central Park, with one of the world’s largest collections of mature live oaks, some of them centuries old.",
"Stroll under giant moss-draped oaks, then visit the free Besthoff Sculpture Garden, with works by famous artists set around lagoons, and the New Orleans Museum of Art next door. It’s a peaceful break from the Quarter.",
"The sculpture garden is free; the art museum charges admission. The holiday light show, Celebration in the Oaks, opens Nov 27, the day you leave. Easy to reach by the Canal Street streetcar (City Park/Museum branch).",
"位于中城、占地1300英亩的公园，比纽约中央公园还大，拥有世界上数量最多的成年橡树之一，有些已有数百年树龄。",
"在挂满苔藓的巨大橡树下散步，再去免费的贝斯特霍夫雕塑花园，名家作品分布在湖畔，旁边就是新奥尔良艺术博物馆。是远离法国区喧闹的好去处。",
"雕塑花园免费，艺术博物馆需购票。节日灯光秀“橡树庆典”11月27日开幕，正好是你们离开那天。可乘运河街有轨电车（城市公园/博物馆支线）到达。",""],
n16:["A guided evening walk through the French Quarter focused on the city’s legends: haunted mansions, voodoo priestess Marie Laveau, pirates and darker chapters of local history.",
"New Orleans is often called one of the most haunted cities in America, and a good guide brings the old streets alive with storytelling. It’s fun, a little spooky and full of real history.",
"Tours run about 2 hours. Some are “haunted pub crawls” limited to 21+, so pick a family-friendly tour. Wear comfortable shoes.",
"傍晚由导游带领的法国区徒步游，主题是这座城市的传说：闹鬼豪宅、巫毒女祭司玛丽·拉沃、海盗，以及当地历史中较黑暗的篇章。",
"新奥尔良常被称为美国最“闹鬼”的城市之一，好的导游讲故事能让老街活起来。有趣、有点吓人，也充满真实历史。",
"约2小时。有些是只限21岁以上的“闹鬼酒吧游”，请选适合家庭的团。穿舒适的鞋。",""],
n17:["A Creole and Cajun cooking class in the French Quarter, where a local chef shows you how to make classics like gumbo, jambalaya and pralines, with plenty of stories and jokes along the way.",
"You learn what makes Louisiana food different, like the “holy trinity” of onion, celery and bell pepper and the dark roux behind gumbo, then sit down and eat everything. You’ll go home able to cook a gumbo for the family.",
"Choose a demonstration class (sit and watch, about 2 hours, cheaper) or a hands-on class (you cook, longer and pricier). Book ahead, since popular times fill up. Recipes are usually provided.",
"法国区的克里奥尔和卡津烹饪课，由本地厨师示范如何做秋葵浓汤、什锦饭和果仁糖等经典菜，一边做一边讲故事、开玩笑。",
"你会了解路易斯安那菜的特别之处，比如洋葱、芹菜、青椒组成的“神圣三位一体”，以及秋葵浓汤背后的深色油面糊，然后坐下来把做好的菜都吃掉。回家后就能给家人做一锅秋葵浓汤。",
"可选示范课（坐着看，约2小时，较便宜）或动手课（自己做，时间更长、价格更高）。热门时段请提前预订。通常会提供食谱。","GUM-bo, JUM-buh-LIE-uh"],
n18:["A commuter ferry across the Mississippi River from the foot of Canal Street to Algiers Point, a quiet 1800s neighborhood on the other bank.",
"For about $2 each way you get one of the best views of the New Orleans skyline from the middle of the river. On the other side, walk the levee path with its jazz history markers, see colorful old cottages and stop at a neighborhood café.",
"Pedestrians and bicycles only, no cars. The crossing takes only a few minutes; boats run roughly every 30 minutes and stop in the evening, so check the schedule. Lovely at sunset.",
"从运河街尽头横渡密西西比河、开往阿尔及尔角的通勤渡轮。阿尔及尔角是对岸一个安静的19世纪老街区。",
"单程约2美元，就能在河中央欣赏新奥尔良天际线的最佳景色之一。到对岸后，可以沿着有爵士历史标牌的河堤小路散步，看色彩缤纷的老房子，在街区咖啡馆歇脚。",
"只载行人和自行车，不能开车。航程只需几分钟；船大约每30分钟一班，晚上停航，请查好时刻表。傍晚看日落很美。","al-JEERZ"],
n19:["The Natchez is a real steam-powered paddlewheel riverboat, the city’s only authentic steamboat, offering two-hour Mississippi River cruises with a live jazz band.",
"You cruise past the French Quarter and the busy port while a jazz band plays, and you can visit the engine room to watch the steam engines work. Before departure, the steam calliope (an organ played with steam whistles) plays tunes you can hear across the Quarter.",
"Choose a daytime harbor cruise (cheaper) or an evening dinner jazz cruise. It boards at the Toulouse Street wharf by Jackson Square. Book ahead, especially for dinner cruises. It can be windy on deck in November.",
"纳奇兹号是一艘真正以蒸汽驱动的明轮船，也是新奥尔良唯一的正宗蒸汽船，提供两小时密西西比河游船，船上有现场爵士乐队。",
"一边听爵士乐，一边驶过法国区和繁忙的港口，还可以参观轮机舱看蒸汽机运转。开船前，蒸汽风琴（用蒸汽汽笛演奏的乐器）会奏乐，整个法国区都听得到。",
"可选白天的港湾游（较便宜）或晚上的爵士晚餐游。在杰克逊广场旁的图卢兹街码头登船。请提前预订，尤其是晚餐游。11月甲板上风会比较大。","NATCH-iz"],
n20:["A beloved Mid-City sandwich shop open since 1911, famous for po-boys: New Orleans’ answer to the sub sandwich, served on French bread with a crackly crust and fluffy inside.",
"The classics are the roast beef “debris” po-boy, soaked in gravy, and the fried shrimp po-boy, “dressed” with lettuce, tomato, pickles and mayo. It’s the kind of place locals argue about, and the patio by the bayou is a nice spot to eat.",
"Expect a line at lunch, though it moves. Check which days it’s open (it closes one weekday). Grab extra napkins for the roast beef. It’s near City Park, so combine the two.",
"中城一家自1911年开业、深受喜爱的三明治店，以“穷小子”三明治闻名：这是新奥尔良版的潜艇三明治，用外皮酥脆、内里蓬松的法棍面包。",
"经典口味是浸满肉汁的烤牛肉碎三明治，以及加了生菜、番茄、酸黄瓜和蛋黄酱的炸虾三明治。这是本地人会争论“哪家最好”的那种店，河湾边的露台很适合坐着吃。",
"午餐时间要排队，但很快。去之前确认营业日（每周有一个工作日休息）。点烤牛肉的话多拿些纸巾。离城市公园很近，可以一起安排。","DAY-bree (debris)"],
n21:["A grand turquoise-and-white restaurant in the Garden District, open since 1893 and widely considered one of the finest restaurants in New Orleans.",
"Weekend jazz brunch is a celebrated local tradition: a jazz trio strolls between tables while you eat dishes like turtle soup, shrimp and grits, and the famous bread pudding soufflé. It’s a splurge, but a memorable family meal.",
"A dress code applies (no shorts, T-shirts or flip-flops; collared shirts for men). Reserve as early as possible, since brunch fills up weeks ahead. Expect roughly $50 to $80 per person before tip. It’s steps from the streetcar.",
"花园区一家蓝绿色与白色相间的豪华餐厅，自1893年开业，被普遍认为是新奥尔良最好的餐厅之一。",
"周末爵士早午餐是备受推崇的本地传统：用餐时爵士三重奏在桌间穿梭演奏，菜品有海龟汤、虾配玉米粥和著名的面包布丁舒芙蕾。虽然价格不菲，但会是难忘的家庭大餐。",
"有着装要求（不能穿短裤、T恤和人字拖；男士需穿有领衬衫）。请尽早预订，早午餐常常提前几周订满。每人约50到80美元（不含小费）。离有轨电车站只有几步路。",""],
n22:["A Creole restaurant in the Tremé neighborhood, opened in 1941 and made famous by the late chef Leah Chase, known as the Queen of Creole Cuisine.",
"During the civil rights movement it was one of the few places where Black and white activists could meet and plan together, and presidents and musicians have dined here. People come for the fried chicken, gumbo and red beans, and for the restaurant’s large collection of African American art.",
"Hours are limited (mostly lunch on certain weekdays), so check before going and reserve if possible. Casual but neat dress. A short drive or rideshare from the French Quarter.",
"位于特雷梅街区的克里奥尔餐厅，1941年开业，因已故主厨莉娅·蔡斯而闻名，她被誉为“克里奥尔美食女王”。",
"民权运动期间，这里是少数黑人和白人活动人士可以一起开会、策划的地方，多位总统和音乐家都曾在此用餐。人们来这里吃炸鸡、秋葵浓汤和红豆饭，也欣赏餐厅收藏的大量非裔美国人艺术作品。",
"营业时间有限（主要是部分工作日的午餐），去之前请确认，最好预订。穿着休闲整洁即可。从法国区开车或打车很近。","DOO-key"],
n23:["Founded in 1789, the oldest existing cemetery in New Orleans, where the dead are buried in above-ground tombs because of the city’s high water table.",
"Rows of whitewashed and crumbling tombs look like a tiny city. Guides tell the stories of famous residents, including voodoo priestess Marie Laveau and Homer Plessy of the landmark Plessy v. Ferguson case, and explain New Orleans burial traditions.",
"Entry is by guided tour only, so book one (about 1 hour). It sits just outside the French Quarter on Basin Street. Respect the tombs; marking or touching them isn’t allowed.",
"建于1789年，是新奥尔良现存最古老的墓地。由于这里地下水位高，逝者都安葬在地上的墓穴里。",
"一排排刷白或斑驳的墓穴看起来像一座小城市。导游会讲述著名“居民”的故事，包括巫毒女祭司玛丽·拉沃，以及著名的普莱西诉弗格森案当事人霍默·普莱西，并介绍新奥尔良的丧葬传统。",
"只能跟导览团进入，请预订（约1小时）。位于法国区外的贝森街。请尊重墓穴，不可在上面涂写或触摸。",""],
n24:["A museum about the music born in New Orleans, housed in the Old U.S. Mint (1835), the only mint to have made coins for both the United States and the Confederacy.",
"Exhibits trace jazz from Congo Square to Louis Armstrong through instruments, photos and recordings, and many afternoons bring free or low-cost concerts in the third-floor performance hall. It’s a calm, inexpensive way to learn the story behind the music you’ll hear all week.",
"Allow 1 to 1.5 hours. It’s at the downriver end of the French Quarter, near the French Market and Frenchmen Street. Check the concert calendar online.",
"一座介绍新奥尔良诞生的爵士乐的博物馆，位于1835年建成的旧美国铸币厂内，这是唯一一座同时为美国和南方邦联铸造过硬币的铸币厂。",
"展览通过乐器、照片和录音，从刚果广场讲到路易斯·阿姆斯特朗；很多下午三楼演出厅还有免费或便宜的音乐会。这是了解你们整周会听到的音乐背后故事的平静又实惠的方式。",
"约需1到1.5小时。位于法国区下游一端，靠近法国市场和法国人街。可上网查音乐会日程。",""],
n25:["An 1823 apothecary in the French Quarter, once run by America’s first licensed pharmacist, filled with antique medicine bottles, surgical tools and a beautiful old soda fountain.",
"It’s small, quirky and a little creepy in a fun way: you’ll see leeches, “gris-gris” voodoo potions and early medical gadgets, and learn how 1800s medicine and yellow fever shaped the city. The courtyard garden of medicinal plants is lovely.",
"Allow about an hour. The guided tour adds great stories, so check tour times. It’s closed some days of the week, so confirm hours. Inexpensive.",
"法国区一家建于1823年的老药房，曾由美国第一位持照药剂师经营，里面摆满古董药瓶、手术器械，还有一座漂亮的老式汽水柜台。",
"小巧、古怪，带点有趣的诡异感：你会看到水蛭、巫毒“护身符”药水和早期医疗器具，了解19世纪的医学和黄热病如何影响这座城市。种满药用植物的庭院花园也很美。",
"约需1小时。导览会讲很多精彩故事，请查好导览时间。每周有几天闭馆，请确认开放时间。票价便宜。","GREE-gree (gris-gris)"],
n26:["A 1.4-mile riverfront park along the Mississippi running from the edge of the French Quarter into the Marigny and Bywater, two colorful, artsy neighborhoods.",
"Walk or bike along the river with skyline views, cross the arched steel bridge locals call the “Rusty Rainbow,” then wander Bywater streets of brightly painted shotgun houses, murals, galleries and laid-back cafés.",
"Free. Best in morning or late-afternoon light. Some Bywater blocks are quiet, so stay on busier streets and go in daylight.",
"沿密西西比河岸、长1.4英里的带状公园，从法国区边缘延伸到马里尼和拜沃特这两个色彩缤纷、充满艺术气息的街区。",
"沿河步行或骑车欣赏天际线，走过被当地人称为“生锈彩虹”的拱形钢桥，再到拜沃特街头逛逛：到处是漆成鲜艳颜色的“猎枪屋”、壁画、画廊和悠闲的咖啡馆。",
"免费。早上或傍晚光线最好。拜沃特有些街段比较冷清，请走人多的街道，白天去。","BY-water"],
n27:["A Thanksgiving-morning tradition since 1907 and one of the oldest continuously held races in the U.S.: a 5-mile run or walk through City Park, plus a kids’ half-mile.",
"Thousands of locals run in turkey hats, pilgrim costumes and team outfits, so it’s as much a party as a race. Your son could run it while you cheer, or the whole family could walk it to earn Thanksgiving dinner.",
"Thursday, Nov 26. The 5-mile run/walk starts at 8:30 a.m. at Tad Gormley Stadium in City Park. Register online in advance (there’s an entry fee) and arrive early for parking.",
"自1907年起的感恩节早晨传统，也是美国持续举办时间最长的赛跑之一：在城市公园跑步或健走5英里，另有儿童半英里赛。",
"成千上万的本地人戴着火鸡帽、穿着清教徒服装或团队服装参赛，与其说是比赛不如说是派对。儿子可以去跑，你们在旁边加油；或者全家一起走完，“挣”一顿感恩节大餐。",
"11月26日周四。5英里跑步/健走早上8:30从城市公园的塔德·戈姆利体育场出发。需提前网上报名（有报名费），早点到以便停车。",""],
n28:["Racing since 1872, the Fair Grounds is one of the oldest horse-racing tracks in the country, and the site of Jazz Fest each spring. Thanksgiving Day is its most festive race day.",
"Locals dress up in big hats and festive outfits, families picnic, and thoroughbreds thunder past the grandstand. It’s a uniquely New Orleans way to spend Thanksgiving, with the Thanksgiving Classic race as the highlight.",
"Thursday, Nov 26. Grandstand general admission is free, with racing from around noon. Clubhouse buffets and boxes cost extra and need reservations. The drinking age is 21.",
"费尔格朗兹赛马场自1872年开始举办赛马，是美国最古老的赛马场之一，每年春天的爵士音乐节也在这里举行。感恩节是这里最热闹的比赛日。",
"本地人戴着大帽子、穿着节日盛装，一家人野餐，在看台上看纯种马飞驰而过。这是非常新奥尔良式的感恩节过法，“感恩节经典赛”是当天的重头戏。",
"11月26日周四。看台普通入场免费，中午前后开赛。会所自助餐和包厢需另付费并提前预订。饮酒需满21岁。",""],
n29:["A free downtown parade kicking off the Bayou Classic, the annual Thanksgiving-weekend football rivalry between two historically Black universities, Southern University and Grambling State.",
"The stars are the marching bands: Southern’s “Human Jukebox” and Grambling’s “World Famed Tiger Marching Band” are famous for their powerful sound, high-stepping dance moves and showmanship. With dance teams and floats, it’s an energetic celebration of HBCU culture.",
"Thursday, Nov 26 at 3 p.m., starting near the Superdome at Poydras Street and Loyola Avenue. Free. Arrive early for a curb spot; streets close and downtown parking is tight.",
"市中心的一场免费游行，为“巴尤经典赛”揭幕。这是每年感恩节周末两所传统黑人大学——南方大学和格兰布林州立大学之间的橄榄球对抗赛。",
"主角是军乐队：南方大学的“人肉点唱机”和格兰布林的“世界闻名老虎军乐队”，以震撼的音色、高抬腿舞步和表演天赋闻名。加上舞蹈队和花车，这是一场充满活力的传统黑人大学文化盛会。",
"11月26日周四下午3点，从超级巨蛋附近（波伊德拉斯街与洛约拉大道路口）出发。免费。早点到占个路边好位置；道路会封闭，市中心停车很难。","BY-oo (bayou)"],
d1:["A 26,000-acre unit of Jean Lafitte National Historical Park, about 30 minutes south of the city, protecting swamp, marsh and bayou forest. It’s named for the pirate Jean Lafitte, who once smuggled goods through these waterways.",
"Raised boardwalk trails lead right into the swamp among cypress, palmettos and hanging moss, with a good chance of spotting alligators, turtles, herons and other wildlife. It’s the real swamp, free, without a boat.",
"Free entry. Allow about 2 hours; the Bayou Coquille trail is the most popular walk. Gators are less active on cool days but often sun themselves on warm afternoons. Bring bug spray and stay on the boardwalks.",
"让·拉菲特国家历史公园的一部分，占地2.6万英亩，位于市区以南约30分钟，保护着沼泽、湿地和河湾森林。它以海盗让·拉菲特命名，他曾经通过这些水道走私货物。",
"高架木栈道带你深入沼泽，周围是柏树、矮棕榈和垂挂的苔藓，很有机会看到鳄鱼、乌龟、苍鹭等野生动物。不用坐船、免费就能看到真正的沼泽。",
"免费入场。约需2小时；最受欢迎的是可基耶河湾步道。天冷时鳄鱼较少活动，但暖和的下午常出来晒太阳。带上驱蚊液，不要离开木栈道。","bah-ruh-TAR-ee-uh, luh-FEET"],
d2:["A Louisiana state park just across the river in Westwego, about 15 minutes from downtown, where fresh and salt water meet in swamps and marshes.",
"It’s the closest easy nature escape: short trails and boardwalks for spotting birds and gators, picnic areas and a boat launch. It’s also known for its floating cabins built right on the bayou.",
"There’s a small per-person entry fee. Allow 1 to 2 hours. The wave pool is a summer-only feature, so expect a quiet park in November.",
"位于河对岸韦斯特韦戈的路易斯安那州立公园，离市中心约15分钟，淡水与咸水在这里的沼泽和湿地交汇。",
"这是最近最方便的亲近自然的地方：短步道和木栈道可以观鸟、看鳄鱼，还有野餐区和码头。这里也以直接建在河湾上的水上小木屋闻名。",
"每人需付少量门票。约需1到2小时。造浪池只在夏季开放，11月公园会很安静。","sen-YET"],
d3:["A boat tour into the Honey Island Swamp near Slidell, about 45 minutes from New Orleans: 250 square miles of river swamp, much of it permanently protected, and one of the least-altered river swamps in the country.",
"Small boats with naturalist guides slip into narrow bayous where you might see alligators, herons, turtles, raccoons and wild hogs. Guides also share local legends, including the Honey Island Swamp Monster, Louisiana’s own Bigfoot.",
"Tours last about 2 hours. Book ahead and choose a small-boat operator for a quieter, more natural experience. Bring a jacket; it’s chilly on the water in November. Pairs well with a day toward the Gulf Coast.",
"在新奥尔良约45分钟车程外的斯莱德尔，乘船深入蜂蜜岛沼泽：250平方英里的河流沼泽，其中大部分受到永久保护，也是全美人为改变最少的河流沼泽之一。",
"小船由博物学导游带领，深入狭窄的河湾，可能看到鳄鱼、苍鹭、乌龟、浣熊和野猪。导游还会讲当地传说，包括“蜂蜜岛沼泽怪物”，也就是路易斯安那版的大脚怪。",
"行程约2小时。请提前预订，选小船公司体验更安静、更自然。11月水上很冷，带件外套。适合和去墨西哥湾海岸的行程一起安排。",""],
d4:["An airboat is a flat-bottomed boat pushed by a giant airplane-style propeller, so it can skim at high speed over shallow marsh and through tall grass where regular boats can’t go. Several operators run tours in the Lafitte area south of New Orleans.",
"It’s the thrill-ride version of a swamp tour: fast turns, spray and wind, with stops to look for alligators and birds. Many teens rank it as the highlight of a Louisiana trip.",
"It’s very loud, so ear protection is provided. It usually costs more than a regular swamp tour and lasts 1 to 1.5 hours. November rides are cold and windy, so bring a warm layer. Less peaceful than a regular boat tour.",
"风扇船是一种平底船，由巨大的飞机式螺旋桨推动，可以在浅水湿地上高速滑行，穿过普通船进不去的高草丛。新奥尔良南边的拉菲特一带有好几家公司经营。",
"这是沼泽游的“刺激版”：急转弯、水花和大风，中途还会停下来找鳄鱼和鸟类。很多青少年都把它列为路易斯安那之行的最大亮点。",
"噪音很大，会提供护耳设备。通常比普通沼泽游贵，时长1到1.5小时。11月又冷又有风，带件保暖外套。不如普通游船安静。",""],
d5:["A guided kayak trip through the Manchac Swamp, a cypress-tupelo swamp between Lake Pontchartrain and Lake Maurepas, about 40 minutes northwest of New Orleans.",
"Paddling quietly lets you glide right up to cypress knees, birds and turtles without a motor scaring them away. Guides share swamp ecology and local ghost stories (Manchac is known for the legend of Julia Brown). It feels like a true adventure.",
"Most tours need no experience; guides teach the basics. Plan 2 to 3 hours. Wear clothes you don’t mind getting wet, and bring a warm layer. Groups are small, so book ahead.",
"跟导游划皮划艇穿越曼查克沼泽，这片柏树和紫树沼泽位于庞恰特雷恩湖和莫勒帕湖之间，在新奥尔良西北约40分钟车程。",
"安静地划桨，可以悄悄靠近柏树膝根、鸟和乌龟，不会被马达声吓跑。导游会讲沼泽生态和当地鬼故事（曼查克以朱莉娅·布朗的传说闻名）。感觉像真正的探险。",
"大多数行程不需要经验，导游会教基本技巧。约需2到3小时。穿不怕湿的衣服，带件保暖外套。团人数少，请提前预订。","MAN-shack"],
d6:["A swamp tour company about 25 miles west of New Orleans in LaPlace, running 90-minute narrated tours through its own privately owned wildlife refuge in the Manchac Swamp.",
"Because the refuge is private, there’s no traffic from other tour boats, so it feels peaceful. Captains are known for Cajun humor and close-up gator sightings, and it’s on the way to the River Road plantations, so it pairs neatly with Whitney or Oak Alley.",
"Covered pontoon boats make it comfortable for all ages. Book ahead. Gators are less active in cool weather, but the swamp scenery is the main event.",
"位于新奥尔良以西约25英里拉普拉斯的沼泽游公司，在曼查克沼泽中自有的私人野生动物保护区内提供90分钟讲解游船。",
"因为保护区是私人的，没有其他游船打扰，感觉很宁静。船长以卡津式幽默和近距离看鳄鱼著称；而且就在去河路种植园的路上，可以和惠特尼或橡树巷种植园一起安排。",
"有顶棚的平底船，各年龄段都舒适。请提前预订。天冷时鳄鱼较少活动，但沼泽风景本身就是主角。",""],
d7:["A museum on a former sugar and indigo plantation along River Road, about an hour west of New Orleans, and the only plantation museum in Louisiana focused entirely on the lives of the enslaved people who lived and worked there.",
"Instead of admiring a mansion, you walk past original slave cabins, a historic church, memorials engraved with the names of thousands of enslaved people and sculptures of children, while first-person accounts tell their stories. It’s emotional and eye-opening, and many visitors call it the most important stop of their trip.",
"Closed Tuesdays. Open 9:30 a.m. to 4:30 p.m., last entry 3 p.m. Choose a guided tour or the self-guided audio tour (available in several languages). Recommended for ages 12 and up. Allow about 2 hours; paths are gravel and mostly outdoors.",
"位于新奥尔良以西约1小时的河路上，由昔日甘蔗和靛蓝种植园改建的博物馆，也是路易斯安那唯一完全聚焦于在此生活和劳作的被奴役者的种植园博物馆。",
"这里不是欣赏豪宅，而是走过原始的奴隶小屋、历史教堂、刻着数千名被奴役者名字的纪念墙和儿童雕塑，同时聆听第一人称的讲述。令人动容、发人深省，很多游客说这是整趟旅行最重要的一站。",
"周二闭馆。开放时间早上9:30至下午4:30，最后入场3点。可选导览或自助语音导览（有多种语言）。建议12岁以上参观。约需2小时，多为户外碎石路。",""],
d8:["A National Historic Landmark on River Road, about an hour west of New Orleans, famous for a quarter-mile avenue of 28 live oaks, roughly 300 years old, leading to an 1839 Greek Revival mansion.",
"The view down the oak alley is one of the most photographed scenes in the South. Visitors tour the “Big House,” walk the gardens and visit a reconstructed slave quarters and exhibit that tells the story of the enslaved people who built and worked the plantation.",
"Open daily from about 8:30 a.m. to 5 p.m. Mansion tours run at assigned times and can sell out, so buy tickets online. Allow at least 2 hours. Whitney is a short drive away, and many people visit Whitney first, then Oak Alley.",
"位于新奥尔良以西约1小时河路上的国家历史地标，以一条四分之一英里长、由28棵约300年树龄的橡树组成的林荫道闻名，尽头是一座1839年的希腊复兴式庄园大宅。",
"橡树长廊的景色是美国南方最常被拍摄的画面之一。游客可以参观“大宅”、漫步花园，并参观复建的奴隶居所和展览，了解建造和经营这座种植园的被奴役者的故事。",
"每天约早上8:30至下午5点开放。大宅导览按指定时间进行，可能售罄，请网上购票。至少预留2小时。离惠特尼种植园车程很短，很多人先去惠特尼，再去橡树巷。",""],
d9:["A 2,800-acre state park on the north shore of Lake Pontchartrain in Mandeville, about 45 minutes from New Orleans via the 24-mile Lake Pontchartrain Causeway, one of the longest bridges over water in the world.",
"It has a sandy lakefront beach, ruins of an 1829 sugar mill, oak-shaded nature trails, a marsh boardwalk and lakefront cabins. More than 400 species of birds and other animals live here, and sunsets over the lake are spectacular.",
"Small per-person entry fee (about $3). Allow a half day, or stay overnight in a cabin. Combine it with the Tammany Trace bike trail, which runs through the park, and Northlake Nature Center next door.",
"位于曼德维尔、庞恰特雷恩湖北岸占地2800英亩的州立公园，从新奥尔良开过24英里长的跨湖大桥（世界最长的水上桥梁之一）约45分钟。",
"这里有湖边沙滩、1829年制糖厂遗迹、橡树成荫的自然步道、湿地木栈道和湖边小木屋。园内有400多种鸟类和其他动物，湖上的日落非常壮观。",
"每人约3美元门票。安排半天，或在小木屋住一晚。可与穿过公园的坦慕尼小径骑行道和隔壁的北湖自然中心一起安排。","FOUNT-in-blue (local way)"],
d10:["A nature preserve right next to Fontainebleau State Park, with boardwalks and trails through swamp, pine forest and hardwood forest.",
"It’s quiet and uncrowded, with a beaver pond, wading birds and a good chance of spotting turtles and other wildlife. An easy, pleasant walk if you’re already on the Northshore.",
"Free (donations welcome). Allow 1 to 2 hours. Trails can be muddy after rain, so wear shoes you don’t mind getting dirty.",
"紧邻枫丹白露州立公园的自然保护区，有木栈道和步道穿过沼泽、松林和阔叶林。",
"安静、人少，有河狸池塘和涉禽，很可能看到乌龟等野生动物。如果已经到了北岸，这里是轻松愉快的散步去处。",
"免费（欢迎捐款）。约需1到2小时。雨后步道可能泥泞，穿不怕脏的鞋。",""],
d11:["A 31-mile paved trail built on an old railroad line, linking the Northshore towns of Slidell, Mandeville, Covington and Abita Springs.",
"It’s flat, shady and easy, perfect for a relaxed family bike ride past bayous, through small towns and into Fontainebleau State Park. Ride between Mandeville and Abita Springs and you can stop at the quirky Abita Mystery House.",
"Rent bikes in Mandeville or Abita Springs (reserve ahead in case supply is limited). A few hours covers a nice out-and-back ride. Look for trailheads with parking and restrooms.",
"一条31英里长的柏油小径，由旧铁路改建，连接北岸的斯莱德尔、曼德维尔、卡温顿和阿比塔泉等小镇。",
"地势平坦、绿荫多、骑起来轻松，非常适合全家悠闲骑车，沿途经过河湾、穿过小镇，还能骑进枫丹白露州立公园。在曼德维尔和阿比塔泉之间骑行，可以顺便去古怪有趣的阿比塔神秘屋。",
"可在曼德维尔或阿比塔泉租自行车（车辆有限，最好预订）。往返骑几个小时就很不错。留意有停车场和洗手间的步道入口。","TAM-uh-nee"],
d12:["A small roadside museum in Abita Springs, officially the UCM Museum (“You See ’Em”), packed with folk art, odd inventions, dioramas and homemade “creatures” built from found objects.",
"It’s pure Louisiana weirdness: buildings covered in mosaic shards, a model town with moving parts and fake hybrid animals like the “bassigator.” A quick, funny stop that teens tend to love.",
"Inexpensive, about 30 to 60 minutes. Pair it with the Tammany Trace or lunch in Abita Springs.",
"阿比塔泉镇的一座小型路边博物馆，正式名称是 UCM 博物馆（谐音“你看见了”），里面塞满民间艺术、奇怪发明、微缩场景，还有用捡来的物件拼成的自制“怪物”。",
"这是纯正的路易斯安那式怪趣：贴满马赛克碎片的建筑、会动的模型小镇，还有“鲈鱼鳄”这样的假杂交动物。适合快速停留、哈哈一笑，青少年通常很喜欢。",
"门票便宜，约30到60分钟。可与坦慕尼小径骑行或在阿比塔泉吃午餐一起安排。","uh-BEE-tuh"],
d13:["One of the largest free-roaming wildlife preserves of its kind in the country, in Folsom on the Northshore about an hour from New Orleans, home to over 2,000 exotic, endangered and threatened animals.",
"You ride in a canopy-covered wagon while giraffes, zebras, camels, bison, antelope and more walk right up to you, and you can hand-feed them from a cup of feed. Coming nose to nose with a giraffe is unforgettable.",
"Wagon safaris run on a set schedule and last about 1.5 to 2 hours; book ahead, especially on weekends. Buy a feed cup, because the animals expect it. It’s all outdoors, so dress for mud and weather.",
"位于北岸福尔瑟姆、距新奥尔良约1小时，是全美同类型中最大的自由放养野生动物保护区之一，有2000多只外来、濒危和受威胁的动物。",
"坐在有顶篷的马车上，长颈鹿、斑马、骆驼、野牛、羚羊等会直接走到你面前，你可以拿着饲料杯亲手喂它们。和长颈鹿脸对脸的体验令人难忘。",
"马车游按固定时间出发，约1.5到2小时；请提前预订，尤其是周末。记得买饲料杯，动物们很期待。全程户外，穿着要适合泥地和天气。",""],
d14:["Every fall weekend, the countryside near Hammond, about an hour from New Orleans, becomes a 16th-century English village with more than 600 artisans, performers and craftspeople in costume.",
"Watch knights joust on horseback, see glassblowers and blacksmiths at work, catch shows on stages all over the village and eat giant turkey legs. Each weekend has a theme (like pirates or Vikings), and many visitors come in costume.",
"Open Saturdays and Sundays, roughly 8:45 a.m. to 5 p.m., rain or shine; in past years it also opened the Friday after Thanksgiving. Admission is about $15 to $45. Plan a half day. Sunday, Nov 22 is your surest chance.",
"每年秋季周末，距新奥尔良约1小时的哈蒙德乡间会变成16世纪的英国村庄，600多位工匠、表演者和手艺人身着古装。",
"可以看骑士骑马比武、看吹玻璃和打铁工匠现场制作、在村里各个舞台看表演，还能啃超大火鸡腿。每个周末都有主题（比如海盗或维京人），很多游客会穿古装来。",
"周六和周日开放，大约早上8:45到下午5点，风雨无阻；往年感恩节后的周五也开放。门票约15到45美元。安排半天。11月22日周日最稳妥。",""],
d15:["Two charming beach towns on the Mississippi Gulf Coast: Bay St. Louis (about 1 hour east) and Ocean Springs (about 1.5 hours east), with long white-sand beaches facing the Gulf.",
"Bay St. Louis has a walkable Old Town with shops, galleries and waterfront seafood. Ocean Springs is an artsy town with oak-lined streets, the Walter Anderson Museum of Art and trails at the Davis Bayou area of Gulf Islands National Seashore. A nice change of state and scenery.",
"A full-day trip. Beaches are calm and uncrowded in November but too cool for most swimmers. Combine it with the Honey Island swamp tour in Slidell on the way.",
"密西西比州墨西哥湾海岸的两座迷人海滨小镇：圣路易斯湾（向东约1小时）和海洋泉（向东约1.5小时），都有面朝墨西哥湾的长长白沙滩。",
"圣路易斯湾的老城区适合步行，有小店、画廊和海边海鲜餐厅。海洋泉是充满艺术气息的小镇，街道两旁是橡树，有沃尔特·安德森艺术博物馆，还有海湾群岛国家海岸戴维斯河湾区的步道。换个州、换种风景。",
"需要一整天。11月海滩平静人少，但对大多数人来说太冷不适合游泳。可以顺路先去斯莱德尔的蜂蜜岛沼泽游。",""]
};

const LS={get(k,d){try{const v=localStorage.getItem("nolapicks:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem("nolapicks:"+k,JSON.stringify(v))}catch(e){}}};

let lang = LS.get("lang", ((navigator.language||"").toLowerCase().startsWith("zh")) ? "zh" : "en");
let tab = LS.get("tab","today"); if(!["today","else","stay"].includes(tab)) tab="today";
let onlyUnrated = false;
let mine = LS.get("mine",{who:"",ratings:{},t:0});
if(!mine || typeof mine!=="object" || !mine.ratings) mine={who:"",ratings:{},t:0};
let others = {};
let mode = "loading";
let db=null, uid=null;
let pendingRender=false;

const L = () => T[lang];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tTime = s => lang==="en" ? s : s.replace("Half day","半天").replace("Full day","一天").replace(" min","分钟").replace(" hr","小时");
const whoName = w => { if(!w) return lang==="zh"?"某人":"Someone"; if(WHO[w]) return WHO[w][lang==="zh"?1:0]; return w; };
const whoEn = w => !w ? "Someone" : (WHO[w] ? WHO[w][0] : w);
const it = id => ITEMS.find(x=>x[0]===id);
const nm = x => lang==="zh" ? x[6] : x[5];

function voters(){
  const list=[{id:"me",who:mine.who,ratings:mine.ratings||{}}];
  Object.keys(others).forEach(k=>{const o=others[k]; if(o&&o.ratings) list.push({id:k,who:o.who||"",ratings:o.ratings});});
  return list;
}
function hasRating(r){ return r && (r.v===1||r.v===0||r.v===-1||r.s||(r.n&&r.n.trim())); }

/* ---------- header ---------- */
function renderHeader(){
  document.documentElement.lang = lang==="zh" ? "zh-CN" : "en";
  document.getElementById("tagline").textContent = L().tagline;
  document.getElementById("langBtn").textContent = L().lang;
  document.getElementById("whoBtn").textContent = mine.who ? whoName(mine.who) : L().pick;
  const tabs=document.getElementById("tabs");
  tabs.innerHTML = ["today","else","stay"].map(k=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${esc(SECS[k][lang==="zh"?"tab_zh":"tab_en"])}</button>`).join("");
  const st=document.getElementById("status");
  st.className="status "+mode;
  document.getElementById("statusText").textContent = {loading:L().sLoading,sync:L().sSync,local:L().sLocal,stale:L().sStale}[mode];
}
function tiles(text){
  return `<div class="tiles sec" aria-label="${esc(text)}">`+[...text].map(ch=>ch===" "?`<span class="gap"></span>`:`<span>${esc(ch)}</span>`).join("")+`</div>`;
}

/* ---------- list ---------- */
function mark(r){
  if(!r) return "";
  let s="";
  if(r.v===1) s+=`<span class="mk up">👍</span>`;
  else if(r.v===0) s+=`<span class="mk side"><span class="side">👍</span></span>`;
  else if(r.v===-1) s+=`<span class="mk down">👎</span>`;
  if(r.s) s+=` <span class="mk star">★</span>`;
  return s;
}

/* ---------- results ---------- */
function scoreOf(id){
  let sc=0,up=0,down=0,stars=[];
  voters().forEach(v=>{const r=v.ratings[id]; if(!r)return;
    if(r.v===1){sc+=2;up++;} else if(r.v===0){sc+=1;} else if(r.v===-1){sc-=2;down++;}
    if(r.s){sc+=2;stars.push(v.who);} });
  return {sc,up,down,stars};
}
function whoLine(id){
  return voters().filter(v=>hasRating(v.ratings[id])).map(v=>{const r=v.ratings[id];return `${esc(whoName(v.who))} ${mark(r)}${r.n?` “${esc(r.n)}”`:""}`;}).join("　");
}
function renderResults(){

  }).join("")+`</div>`;

  html+=block(L().mustH, scored.filter(o=>o.stars.length).sort((a,b)=>b.sc-a.sc));
  html+=block(L().topH, scored.filter(o=>o.sc>0&&!o.stars.length).sort((a,b)=>b.sc-a.sc).slice(0,15));
  html+=block(L().splitH, scored.filter(o=>o.up&&o.down));

  return html;
}
function buildExport(){
  const vs=voters();
  const rated = v=>ITEMS.filter(vis).filter(x=>{const r=v.ratings[x[0]];return r&&(r.v===1||r.v===0||r.v===-1);}).length;
  const d=new Date();
  let out=`NOLA TRIP VOTES, ROUND 2 (exported ${d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})})\n`;
  out+=`Trip: Nov 21–27, Houston to New Orleans by car\n`;
  out+=`Key: UP = want to go, SIDE = maybe, DOWN = skip, *MUST* = must-do. Score: up +2, side +1, down −2, must-do +2.\n`;
  out+=`Voters: `+vs.map(v=>`${whoEn(v.who)} (${rated(v)}/${ITEMS.filter(vis).length} rated)`).join(", ")+(mode==="sync"?"":" [sync off: this phone only]")+`\n`;
  const word=r=>r.v===1?"UP":r.v===0?"SIDE":r.v===-1?"DOWN":"no vote";
  const untouched=[];
  ["r","n","d"].forEach(s=>{
    const head={r:"ON THE WAY (I-10, Houston to NOLA)",n:"IN NEW ORLEANS",d:"DAY TRIPS FROM NOLA"}[s];
    const lines=[];
    ITEMS.filter(x=>x[1]===s&&vis(x)).map(x=>({x,...scoreOf(x[0])})).sort((a,b)=>b.sc-a.sc).forEach(o=>{
      const parts=vs.filter(v=>hasRating(v.ratings[o.x[0]])).map(v=>{const r=v.ratings[o.x[0]];return `${whoEn(v.who)}: ${word(r)}${r.s?" *MUST*":""}${r.n?` (note: "${r.n.replace(/\s+/g," ").trim()}")`:""}`;});
      if(!parts.length){untouched.push(o.x[5]);return;}
      lines.push(`- ${o.x[5]} [score ${o.sc}] ${parts.join("; ")}${o.x[10]?` [${TAGS[o.x[10]][0]}]`:""}`);
    });
    out+=`\n## ${head}\n`+(lines.length?lines.join("\n"):"- (no votes yet)")+`\n`;
  });
  out+=`\n## THURSDAY PLAN\n`+vs.map(v=>{const t=THU.find(t=>t[0]===(v.id==="me"?mine.thu:(others[v.id]||{}).thu));return `- ${whoEn(v.who)}: ${t?t[1].replace(/^\S+ /,""):"no answer"}`;}).join("\n")+`\n`;
  out+=`\n## WEDNESDAY BASE (where to stay Wed 11/25)\n`+WB.map(b=>({b,...scoreOf(b.id)})).sort((a,b)=>b.sc-a.sc).map(o=>{const parts=vs.filter(v=>hasRating(v.ratings[o.b.id])).map(v=>{const r=v.ratings[o.b.id];return `${whoEn(v.who)}: ${r.v===1?"UP":r.v===0?"SIDE":r.v===-1?"DOWN":"no vote"}${r.s?" *MUST*":""}${r.n?` (note: "${r.n.replace(/\s+/g," ").trim()}")`:""}`;});return `- ${o.b.n[0]} [score ${o.sc}] ${parts.length?parts.join("; "):"(no votes)"}`;}).join("\n")+`\n`;
  if(untouched.length) out+=`\n## NOT RATED BY ANYONE\n- `+untouched.join("\n- ")+`\n`;
  return out;
}

/* ---------- saving ---------- */
let saveTimer=null,saving=false,again=false,retries=0;
function touch(){ mine.t=Date.now(); LS.set("mine",mine); scheduleSave(); }
function scheduleSave(){
  if(!db||!uid||mode==="local") return;
  clearTimeout(saveTimer); saveTimer=setTimeout(doSave,700);
}
async function doSave(){
  if(saving){again=true;return;}
  saving=true;
  try{
    await db.doc("votes/"+uid).set({who:mine.who||"",ratings:JSON.parse(JSON.stringify(mine.ratings)),t:mine.t||Date.now()});
    retries=0;
  }catch(e){
    const c=e&&e.code;
    if(c==="unavailable"&&retries<1){retries++;saving=false;setTimeout(doSave,1200+Math.random()*1200);return;}
    setMode("local");
  }
  saving=false;
  if(again){again=false;doSave();}
}
function setMode(m){ mode=m; renderHeader(); if(tab==="res") renderSoon(); }

main.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b) return;
  if(b.dataset.act==="thu"){ mine.thu = mine.thu===b.dataset.v ? undefined : b.dataset.v; touch(); render(); return; }
  if(b.dataset.act==="gotab"){ tab=b.dataset.tab; LS.set("tab",tab); render(); window.scrollTo(0,0); return; }
  const id=b.closest(".item").dataset.id;
  if(b.dataset.act==="zoom"){ openZoom(id,Number(b.dataset.i)); return; }
  if(b.dataset.act==="addp"){ pendingItem=id; document.getElementById("fileIn").click(); return; }
  const r=Object.assign({},mine.ratings[id]||{});
  if(b.dataset.act==="vote"){ const v=Number(b.dataset.v); if(r.v===v) delete r.v; else r.v=v; }
  if(b.dataset.act==="star"){ r.s=!r.s; if(r.s&&r.v===undefined) r.v=1; }
  if(r.v===undefined&&!r.s&&!r.n) delete mine.ratings[id]; else mine.ratings[id]=r;
  touch();
  const art=b.closest(".item"); const tmp=document.createElement("div"); tmp.innerHTML = WBMAP[id] ? wcard(WBMAP[id]) : card(it(id)); art.replaceWith(tmp.firstElementChild);
  const tb=main.querySelector(".toolbar span"); if(tb){const items=ITEMS.filter(x=>x[1]===tab&&vis(x));tb.textContent=L().rated(items.filter(x=>{const q=mine.ratings[x[0]];return q&&(q.v===1||q.v===0||q.v===-1);}).length,items.length);}
});
let noteTimer=null;
main.addEventListener("input",e=>{
  if(e.target.classList.contains("note")){
    const id=e.target.closest(".item").dataset.id;
    const r=Object.assign({},mine.ratings[id]||{}); r.n=e.target.value.slice(0,200);
    if(!r.n) delete r.n;
    if(r.v===undefined&&!r.s&&!r.n) delete mine.ratings[id]; else mine.ratings[id]=r;
    clearTimeout(noteTimer); noteTimer=setTimeout(touch,500);
  }
});
main.addEventListener("change",e=>{ if(e.target.id==="unratedToggle"){ onlyUnrated=e.target.checked; render(); } });
main.addEventListener("focusout",e=>{ if(e.target.classList&&e.target.classList.contains("note")){ clearTimeout(noteTimer); touch(); if(pendingRender) setTimeout(()=>{ if(!(document.activeElement&&document.activeElement.classList.contains("note"))) render(); },50);} });
main.addEventListener("click",async e=>{
  if(e.target.id!=="copyBtn") return;
  const txt=buildExport(); const ta=document.getElementById("exportText"); ta.value=txt;
  const msg=document.getElementById("copied");
  try{ await navigator.clipboard.writeText(txt); msg.textContent=L().copied; }
  catch(err){ try{ ta.focus(); ta.select(); const ok=document.execCommand("copy"); msg.textContent= ok?L().copied:L().copyFail; }catch(e2){ msg.textContent=L().copyFail; } }
});

/* ---------- who sheet ---------- */
function fillSheet(){
  document.getElementById("sheetTitle").textContent=L().sheetTitle;
  document.getElementById("sheetSub").textContent=L().sheetSub;
  document.getElementById("whos").innerHTML=Object.keys(WHO).map(k=>`<button data-who="${k}">${esc(whoName(k))}</button>`).join("");
  document.getElementById("otherName").placeholder=L().otherPh;
  document.getElementById("otherGo").textContent=L().otherGo;
}
function openSheet(){ fillSheet(); document.getElementById("sheet").hidden=false; }
function setWho(w){ mine.who=w; touch(); document.getElementById("sheet").hidden=true; render(); }
document.getElementById("whos").addEventListener("click",e=>{ const b=e.target.closest("[data-who]"); if(b) setWho(b.dataset.who); });
document.getElementById("otherGo").addEventListener("click",()=>{ const v=document.getElementById("otherName").value.trim(); if(v) setWho(v.slice(0,24)); });
document.getElementById("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet"&&mine.who) e.currentTarget.hidden=true; });

/* ---------- photos ---------- */
let zItem=null,zIdx=0,toastT=null;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2600);}
function showZoom(){
  const list=photos[zItem]||[]; if(!list.length){closeZoom();return;}
  zIdx=(zIdx+list.length)%list.length; const p=list[zIdx];
  document.getElementById("zBox").innerHTML = p.n>1 ? `<div class="zsp">${imgTag(p,nameOf(zItem),false)}</div>` : imgTag(p,nameOf(zItem),false).replace("<img ","<img class=\"zsingle\" ");
  const src=(typeof p.s==="string"&&/^https?:\/\//.test(p.s))?` · <a href="${esc(p.s)}" target="_blank" rel="noopener">${esc(L().source)}</a>`:"";
  document.getElementById("zCap").innerHTML=`<b>${esc(nameOf(zItem))}</b> (${zIdx+1}/${list.length})${p.c?"<br>"+esc(p.c):""}${src}`;
  document.getElementById("zClose").textContent=L().close;
  const multi=list.length>1; document.getElementById("zPrev").hidden=!multi; document.getElementById("zNext").hidden=!multi;
}
function openZoom(id,i){zItem=id;zIdx=i;document.getElementById("zoom").hidden=false;showZoom();}
function closeZoom(){document.getElementById("zoom").hidden=true;document.getElementById("zBox").innerHTML="";}
document.getElementById("zClose").addEventListener("click",closeZoom);
document.getElementById("zPrev").addEventListener("click",()=>{zIdx--;showZoom();});
document.getElementById("zNext").addEventListener("click",()=>{zIdx++;showZoom();});
document.getElementById("zBox").addEventListener("click",closeZoom);
document.addEventListener("keydown",e=>{ if(document.getElementById("zoom").hidden) return; if(e.key==="Escape")closeZoom(); if(e.key==="ArrowLeft"){zIdx--;showZoom();} if(e.key==="ArrowRight"){zIdx++;showZoom();} });
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const sc=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
  } finally { URL.revokeObjectURL(url); }
}
document.getElementById("fileIn").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; const id=pendingItem; pendingItem=null;
  if(!f||!id||!assetsNS||!db) return;
  toast(L().uploading);
  try{
    const blob=await shrink(f); if(!blob) throw new Error("resize");
    const r=await assetsNS.upload(blob,{type:"image/jpeg"});
    const list=(photos[id]||[]).slice(); list.push({a:r.id,c:mine.who?("Added by "+whoEn(mine.who)):"",s:""});
    await db.doc("photos/"+id).set({list});
    toast(L().uploaded);
  }catch(err){ toast(L().uploadFail); }
});

/* ---------- shared sync ---------- */
async function init(){
  if(!window.claude||typeof window.claude.use!=="function"){ setMode("local"); return; }
  const timer=setTimeout(()=>{ if(mode==="loading") setMode("stale"); },10000);
  try{
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u){ clearTimeout(timer); setMode("local"); return; }
    const id=await u.id();
    if(!id){ clearTimeout(timer); setMode("local"); return; }
    db=d; uid=id;
    db.collection("votes").onSnapshot(snap=>{
      const o={}; let myRemote=null;
      snap.docs.forEach(doc=>{ if(!doc.exists) return; const v=doc.data(); if(!v) return; if(doc.id===uid) myRemote=v; else o[doc.id]=v; });
      others=o;
      if(myRemote && (myRemote.t||0) > (mine.t||0)){
        mine={who:myRemote.who||mine.who||"",ratings:JSON.parse(JSON.stringify(myRemote.ratings||{})),t:myRemote.t};
        LS.set("mine",mine);
        
      } else if(!snap.metadata.fromCache && (mine.t||0) > ((myRemote&&myRemote.t)||0)){
        scheduleSave();
      }
      if(!snap.metadata.fromCache){ clearTimeout(timer); if(mode!=="local") mode="sync"; }
      renderSoon();
    }, ()=>{ clearTimeout(timer); setMode("local"); });
    db.collection("photos").onSnapshot(snap=>{
      const o={};
      snap.docs.forEach(doc=>{ if(!doc.exists) return; const v=doc.data(); if(v&&Array.isArray(v.list)) o[doc.id]=v.list.filter(p=>p&&typeof p.a==="string"&&HEX.test(p.a)&&(p.n===undefined||(Number.isInteger(p.n)&&p.n>0&&p.n<=8&&Number.isInteger(p.k)&&p.k>=0&&p.k<p.n))); });
      photos=o; renderSoon();
    }, ()=>{});
    window.claude.use("assets").then(a=>{ if(a){ assetsNS=a; canUpload=true; renderSoon(); } }).catch(()=>{});
  }catch(e){ clearTimeout(timer); setMode("local"); }
}

render();

init();
</script>
